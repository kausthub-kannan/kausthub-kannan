# MkDocs configuration. The site is sourced ONLY from blogs/ (docs_dir) —
# nothing else in this repo (root README, header.jpg, PDFs, …) is published.
site_name: KK's Days
site_author: Kausthub Kannan
site_description: Personal website and blogs — ML, Agents, System Design.
# Project-pages URL for kausthub-kannan/kausthub-kannan.
# If you switch to a custom domain or a *.github.io user site, update this.
site_url: https://kausthub-kannan.github.io/kausthub-kannan/
repo_url: https://github.com/kausthub-kannan/kausthub-kannan

docs_dir: blogs

theme:
  name: material
  logo: assets/dp.jpg
  favicon: assets/dp.jpg
  # Single dark scheme so the navy background + white text always apply.
  palette:
    - scheme: slate
      primary: black
      accent: red
  features:
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search
  - awesome-nav
  - excalidraw
  - glightbox

# Keep Obsidian internals, drawing sources and helper scripts out of the site.
# Paths are relative to docs_dir (blogs/).
exclude_docs: |
  .obsidian/*
  assets/excalidraw/*.excalidraw.md
  scripts/*

# No nav: section here — navigation is generated automatically from blogs/
# via blogs/.nav.yml (awesome-nav). Never edit nav manually.
